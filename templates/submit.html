{% extends "base.html" %}
{% block body %}
<div class="grid">
  <section class="card">
    <div class="tabs">
      <button type="button" class="tab-btn on" data-tab="tab-form">Vendor form</button>
      <button type="button" class="tab-btn" data-tab="tab-sample">JSON file</button>
    </div>

    <form id="tab-form" class="tab" data-mode="form" autocomplete="off">
      <div class="fields">
        <label>Company name<input name="company_name"></label>
        <label>Country<select name="country">{% for c in country %}<option value="{{ c }}" {{ 'selected' if c == 'IN' }}>{{ names[c] }}</option>{% endfor %}</select></label>
        <label>Website (optional)<input name="website"></label>
        <label>Email<input name="email" type="text"></label>
        <label>Mobile number<input name="mobile"></label>
        <label class="wide">Address<textarea name="address" rows="2"></textarea></label>
        <label>Tax ID (GSTIN for India, EIN for the US, VAT ID for Germany)<input name="tax_id"></label>
        <label>PAN (India only)<input name="pan"></label>
        <label>Bank account holder name<input name="bank_account_name"></label>
        <label>Bank account number (IBAN for Germany)<input name="bank_account_number"></label>
        <label class="wide">Bank code (IFSC for India, routing number for the US, BIC for Germany)<input name="bank_code"></label>
      </div>
      <h3>Documents</h3>
      <div class="fields">
        {% for slot, text in doc_slots.items() %}<label>{{ text }}<input type="file" name="{{ slot }}"></label>{% endfor %}
      </div>
      <button class="primary">Submit</button>
    </form>

    <form id="tab-sample" class="tab" data-mode="sample" hidden>
      <label>Choose a sample
        <select name="sample"><option value="" selected disabled>Select a sample...</option>{% for value, label in samples %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
      </label>
      <label>...or select your own JSON file to upload<input type="file" name="json_file" accept=".json,application/json"></label>
      <button class="primary">Submit</button>
    </form>
    <p class="error" id="error" hidden></p>
  </section>

  <section class="card" id="result">
    <h2 id="result-title">Verification progress</h2>
    <p class="muted" id="placeholder">Each verification step appears here as it happens. Fill in the form, or choose a sample, then submit.</p>
    <ol id="stages" class="stages"></ol>
    <div id="outcome"></div>
  </section>
</div>
{% endblock %}
